name: Portões de publicação (TEC)
description: Bloqueia releases quando há PRs abertos ou o check ci-ok mais recente não passou.

inputs:
  allow-open-prs:
    description: "true para permitir PRs abertos, mantendo a exigência de ci-ok aprovado"
    default: "false"

runs:
  using: composite
  steps:
    - name: Validar PRs e ci-ok
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ALLOW_OPEN_PRS: ${{ inputs.allow-open-prs }}
        SCRIPT: ${{ github.action_path }}/release_gates.py
      run: python3 "$SCRIPT"
