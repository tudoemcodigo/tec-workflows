name: Convenções (TEC)
description: >
  Confere se os arquivos compartilhados do componente (build, .editorconfig, nuget.config, dependabot, ...)
  são idênticos ao template desta versão do tec-workflows, preserva README/CHANGELOG específicos e exige a marca
  Tudo em Código em todos os READMEs.

runs:
  using: composite
  steps:
    - name: Arquivos canônicos
      shell: bash
      env:
        TEMPLATE: ${{ github.action_path }}/../../template
      run: |
        set -euo pipefail
        rc=0
        while IFS= read -r -d '' file; do
          rel="${file#./}"
          if [ ! -f "$rel" ]; then
            echo "::error file=$rel::Arquivo canônico ausente (rode scripts/sync-template.sh do tec-workflows)."
            rc=1
          # README e CHANGELOG são inicializados pelo template, mas pertencem ao componente.
          elif [[ "$rel" == "README.md" || "$rel" == "CHANGELOG.md" ]]; then
            continue
          elif ! cmp -s "$TEMPLATE/$rel" "$rel"; then
            echo "::error file=$rel::Diverge do template do tec-workflows (edite lá e rode scripts/sync-template.sh)."
            rc=1
          fi
        done < <(cd "$TEMPLATE" && find . -type f -print0)
        while IFS= read -r -d '' readme; do
          if ! grep -Fq 'tudoemcodigo-icone-512.png' "$readme"; then
            echo "::error file=$readme::README sem a marca Tudo em Código."
            rc=1
          fi
        done < <(find . -name README.md -not -path './.git/*' -not -path '*/obj/*' -not -path '*/bin/*' -print0)
        if [ "$rc" -eq 0 ]; then
          echo "### ✅ Arquivos compartilhados e marca dos READMEs verificados" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$rc"

    - name: Licença e Atribuição (NOTICE)
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -f "NOTICE" ]; then
          echo "::error file=NOTICE::Arquivo NOTICE de atribuição exigido pela convenção TEC ausente na raiz do repositório."
          exit 1
        fi
        echo "### ✅ Arquivo NOTICE de atribuição verificado" >> "$GITHUB_STEP_SUMMARY"

    - name: Convenções dos projetos
      shell: bash
      run: |
        set -euo pipefail
        rc=0
        # Versões só no Directory.Packages.props (Central Package Management) e componentes TEC.* só por <TecReference>
        while IFS= read -r -d '' proj; do
          if grep -Eq '<PackageReference[^>]+Version=' "$proj" || grep -Eq 'VersionOverride=' "$proj"; then
            echo "::error file=$proj::PackageReference com Version ou VersionOverride: declare a versão no Directory.Packages.props."
            rc=1
          fi
          if grep -Eq '<PackageReference[^>]+Include="TEC\.' "$proj"; then
            echo "::error file=$proj::Componente TEC.* via PackageReference: use <TecReference Include=\"TEC.X\" />."
            rc=1
          fi
          if grep -Eq '<(Version|PackageVersion|VersionPrefix|VersionSuffix)>' "$proj"; then
            echo "::error file=$proj::Versão no csproj (<Version>, <PackageVersion>, <VersionPrefix>, <VersionSuffix>): a versão é única por repositório (Directory.Build.props)."
            rc=1
          fi
        done < <(find . -name '*.csproj' -not -path './.git/*' -print0)

        exit "$rc"
