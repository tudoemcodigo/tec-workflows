name: Release (.NET)

# Publicação manual de uma versão estável ou rc de um componente lib-tec-*, chamada pelo release.yml do repositório
# com a versão digitada. As prévias saem sozinhas do dotnet-ci.yml a cada push na main.
#
#   validar ──┬── conventions ──────────────────────────────┐
#             ├── pack (versão digitada) ───────────────────┤
#             ├── unit (net10.0 + cobertura, sem ICU) ┼── release (tag + Release) ── publicar (GitHub Packages)
#             └── codeql ───────────────────────────────────┘
#                  └── report (testes + cobertura no resumo)
#
# Testes: só os unitários, com cobertura. Integração, carga, suítes pesadas e benchmarks não fazem parte da publicação
# (a integração já roda no CI de cada PR e de cada push na main; o resto, sob demanda no performance.yml).
#
# Validação da versão (actions/versao): formato X.Y.Z ou X.Y.Z-rc.N, igual à <Version> do Directory.Build.props, tag
# inexistente e maior que a última versão lançada (SemVer: 1.0.0-rc.1 < 1.0.0 < 1.0.1).
#
# Tudo em paralelo. A tag e o Release são criados ANTES do push no feed: uma falha na tag nunca deixa pacote órfão.
# Se o push falhar, basta "Re-run failed jobs" (a reexecução usa --skip-duplicate).
#
# Os jobs "release" e "publicar" usam o environment publish-environment (padrão "publicacao"): configure nele
# revisores obrigatórios e deployment branches = main para proteger tanto a tag/Release quanto o envio ao feed.
#
# Permissões que o workflow chamador concede ao job que usa este arquivo:
#   contents: write, packages: write, actions: read, checks: read, pull-requests: read,
#   security-events: write, id-token: write, attestations: write
#   (id-token: write e attestations: write são usados no job release para gerar atestado SLSA de proveniência)
on:
  workflow_call:
    inputs:
      version:
        description: "Versão (ex.: 1.2.0 ou 1.3.0-rc.1); aceita 'v' inicial. Prévias saem do CI"
        type: string
        required: true
      solution:
        type: string
        required: true
      unit-tests:
        type: string
        required: true
      env:
        type: string
        default: ""
      private-feed:
        type: boolean
        default: false
      codeql-build-mode:
        type: string
        default: none
      codeql-queries:
        type: string
        default: security-extended
      coverage-title:
        description: "Título do relatório de cobertura (padrão: nome do repositório)"
        type: string
        default: ""
      publish-environment:
        description: "Environment do job que cria a tag e o Release (aprovação e branch); não deixe vazio"
        type: string
        default: publicacao
      allow-open-prs:
        description: "true: permite publicação mesmo com PRs abertos contra a main (padrão: false)"
        type: boolean
        default: false
    secrets:
      nuget-publish-token:
        description: "Token customizado com permissão packages:write (se omitido, usa github.token)"
        required: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

jobs:
  validar:
    name: Validar versão
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      version: ${{ steps.versao.outputs.version }}
    steps:
      - name: Branch
        shell: bash
        env:
          PUBLISH_ENVIRONMENT: ${{ inputs.publish-environment }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Execute a partir da main (atual: $GITHUB_REF_NAME)."
            exit 1
          fi
          if [ -z "$PUBLISH_ENVIRONMENT" ]; then
            echo "::error::publish-environment não pode ser vazio."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Portões de publicação
        uses: tudoemcodigo/tec-workflows/actions/release-gates@v1
        with:
          allow-open-prs: ${{ inputs.allow-open-prs }}

      # A versão digitada chega por entrada da action (variável de ambiente no script), nunca interpolada em "run"
      - name: Validar
        id: versao
        uses: tudoemcodigo/tec-workflows/actions/versao@v1
        with:
          modo: release
          versao: ${{ inputs.version }}
          token: ${{ github.token }}

  conventions:
    name: Convenções
    needs: validar
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Convenções
        uses: tudoemcodigo/tec-workflows/actions/check-conventions@v1

  pack:
    name: Build e pacote
    needs: validar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # o token não fica no .git/config enquanto o build executa

      - name: Setup .NET
        uses: tudoemcodigo/tec-workflows/actions/setup-dotnet@v1
        with:
          runtimes: ""
          private-feed: ${{ inputs.private-feed }}
          nuget-token: ${{ github.token }}
          restore: ${{ inputs.solution }}

      # A versão chega por variável de ambiente: valores interpolados com ${{ }} dentro de "run" viram texto do script
      - name: Build
        env:
          SOLUTION: ${{ inputs.solution }}
          VERSION: ${{ needs.validar.outputs.version }}
        run: dotnet build "$SOLUTION" -c Release --no-restore "-p:Version=$VERSION"

      - name: Pack
        env:
          SOLUTION: ${{ inputs.solution }}
          VERSION: ${{ needs.validar.outputs.version }}
        run: dotnet pack "$SOLUTION" -c Release --no-build "-p:Version=$VERSION" -o ./artifacts

      - name: Upload pacotes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget
          path: artifacts/*
          retention-days: 30

  unit:
    name: Unitários
    needs: validar
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: net10.0, tfm: net10.0, coverage: true, invariant: false }
          - { name: net10.0-sem-icu, tfm: net10.0, coverage: false, invariant: true }
    uses: tudoemcodigo/tec-workflows/.github/workflows/dotnet-test.yml@v1
    permissions:
      contents: read
      packages: read
      id-token: write   # só teto: sem azure-client-id, o dotnet-test.yml roda o job sem id-token
    with:
      name: ${{ matrix.name }}
      tests: ${{ inputs.unit-tests }}
      tfm: ${{ matrix.tfm }}
      coverage: ${{ matrix.coverage }}
      invariant: ${{ matrix.invariant }}
      env: ${{ inputs.env }}
      private-feed: ${{ inputs.private-feed }}
      artifact: unit-${{ matrix.name }}

  report:
    name: Relatório
    needs: unit
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Relatório
        uses: tudoemcodigo/tec-workflows/actions/test-report@v1
        with:
          coverage-title: ${{ inputs.coverage-title || github.event.repository.name }}

  codeql:
    name: CodeQL
    needs: validar
    uses: tudoemcodigo/tec-workflows/.github/workflows/codeql-dotnet.yml@v1
    permissions:
      contents: read
      actions: read
      security-events: write   # upload do SARIF para o code scanning
      packages: read
    with:
      solution: ${{ inputs.solution }}
      build-mode: ${{ inputs.codeql-build-mode }}
      queries: ${{ inputs.codeql-queries }}
      private-feed: ${{ inputs.private-feed }}

  # Portão: nada é publicado se qualquer verificação falhou ou foi cancelada (jobs pulados contam como sucesso)
  release:
    name: Criar tag e Release
    needs: [validar, conventions, pack, unit, codeql]
    if: >-
      ${{ !cancelled() && needs.pack.result == 'success' && needs.unit.result == 'success' &&
      needs.conventions.result == 'success' && needs.codeql.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Aprovação, histórico e restrição de branch da publicação (configurados no environment do repositório). O job
    # "publicar" depende deste: não roda sem a aprovação.
    environment: ${{ inputs.publish-environment }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download pacotes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget
          path: artifacts

      - name: Validar pacotes antes de publicar
        shell: bash
        env:
          VERSION: ${{ needs.validar.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(artifacts/*.nupkg)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "::error::Nenhum pacote .nupkg encontrado."
            exit 1
          fi
          for pkg in "${pkgs[@]}"; do
            if [[ "$pkg" != *".$VERSION.nupkg" ]]; then
              echo "::error::Pacote $pkg não corresponde à versão validada ($VERSION)."
              exit 1
            fi
          done

      # Gere o atestado antes de criar a tag/Release para uma falha de proveniência não deixar uma publicação parcial.
      - name: Atestar proveniência dos pacotes (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/*.nupkg'

      - name: Criar tag e Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validar.outputs.version }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$VERSION" == *-* ]]; then FLAGS+=(--prerelease); fi
          shopt -s nullglob
          pkgs=(artifacts/*.nupkg)
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A retomada após falha de upload reutiliza a Release e substitui os assets pelo mesmo build validado.
            gh release upload "v$VERSION" "${pkgs[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$VERSION" "${pkgs[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "v$VERSION" \
              --generate-notes \
              "${FLAGS[@]}"
          fi

  publicar:
    name: Publicar no GitHub Packages
    needs: [validar, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.publish-environment }}
    permissions:
      packages: write   # push no feed NuGet do GitHub
    steps:
      - name: Download pacotes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget
          path: artifacts

      # O dotnet já instalado no runner basta para o push (sem global.json: não há checkout).
      # O GitHub Packages não aceita .snupkg; os símbolos ficam embutidos no .nupkg.
      # Primeira tentativa sem --skip-duplicate: versão estável já existente no feed é erro (a tag acabou de ser
      # criada). Só o "Re-run failed jobs" ignora o pacote já enviado.
      - name: Push no GitHub Packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.nuget-publish-token || github.token }}
          VERSION: ${{ needs.validar.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(artifacts/*.nupkg)
          shopt -u nullglob
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "::error::Nenhum pacote .nupkg encontrado na pasta artifacts/."
            exit 1
          fi
          # Valida que todos os pacotes correspondem estritamente à versão de release
          for pkg in "${pkgs[@]}"; do
            if [[ "$pkg" != *".$VERSION.nupkg" ]]; then
              echo "::error::Pacote $pkg possui versão divergente da versão de release ($VERSION)."
              exit 1
            fi
          done
          ARGS=(--source "$NUGET_FEED" --api-key "$NUGET_API_KEY" --no-symbols)
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then ARGS+=(--skip-duplicate); fi
          dotnet nuget push "artifacts/*.nupkg" "${ARGS[@]}"

      - name: Resumo
        env:
          VERSION: ${{ needs.validar.outputs.version }}
        run: |
          echo "### ✅ [v$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION) publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "Feed: \`$NUGET_FEED\`" >> "$GITHUB_STEP_SUMMARY"
