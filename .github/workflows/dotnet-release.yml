name: Release (.NET)

# Publicação manual de uma versão estável ou rc de um componente lib-tec-*, chamada pelo release.yml do repositório
# com a versão digitada. As prévias saem sozinhas do dotnet-ci.yml a cada push na main.
#
#   validar ──┬── conventions ──────────────────────────────┐
#             ├── pack (versão digitada) ───────────────────┤
#             ├── unit (net10.0 + cobertura, net8.0, sem ICU) ┼── release (tag + Release) ── publicar (GitHub Packages)
#             └── codeql ───────────────────────────────────┘
#                  └── report (testes + cobertura no resumo)
#
# Testes: só os unitários, com cobertura. Integração, carga, suítes pesadas e benchmarks não fazem parte da publicação
# (a integração já roda no CI de cada PR e de cada push na main; o resto, sob demanda no performance.yml).
#
# Tudo em paralelo. A tag e o Release são criados ANTES do push no feed: uma falha na tag nunca deixa pacote órfão.
# Se o push falhar, basta "Re-run failed jobs" (--skip-duplicate).
#
# Permissões que o workflow chamador concede ao job que usa este arquivo:
#   contents: write, packages: write, actions: read, security-events: read, id-token: write
on:
  workflow_call:
    inputs:
      version:
        description: "Versão (ex.: 1.2.0 ou 1.3.0-rc.1); aceita 'v' inicial. Prévias saem do CI"
        type: string
        required: true
      solution:
        type: string
        required: true
      unit-tests:
        type: string
        required: true
      env:
        type: string
        default: ""
      private-feed:
        type: boolean
        default: false
      codeql-build-mode:
        type: string
        default: none
      codeql-queries:
        type: string
        default: security-extended
      coverage-title:
        description: "Título do relatório de cobertura (padrão: nome do repositório)"
        type: string
        default: ""

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

jobs:
  validar:
    name: Validar versão
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.validar.outputs.version }}
    steps:
      - name: Validar
        id: validar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSAO#v}"

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Execute a partir da main (atual: $GITHUB_REF_NAME)."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc.[1-9][0-9]*)?$ ]]; then
            echo "::error::A versão '$VERSAO' não segue o padrão X.Y.Z ou X.Y.Z-rc.N (prévias saem do CI a cada push na main)."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::A tag v$VERSION já existe."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### 📦 Versão: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  conventions:
    name: Convenções
    needs: validar
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Convenções
        uses: tudoemcodigo/tec-workflows/actions/check-conventions@v1

  pack:
    name: Build e pacote
    needs: validar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # o token não fica no .git/config enquanto o build executa

      - name: Setup .NET
        uses: tudoemcodigo/tec-workflows/actions/setup-dotnet@v1
        with:
          runtimes: ""
          private-feed: ${{ inputs.private-feed }}
          nuget-token: ${{ github.token }}
          restore: ${{ inputs.solution }}

      # A versão chega por variável de ambiente: valores interpolados com ${{ }} dentro de "run" viram texto do script
      - name: Build
        env:
          SOLUTION: ${{ inputs.solution }}
          VERSION: ${{ needs.validar.outputs.version }}
        run: dotnet build "$SOLUTION" -c Release --no-restore "-p:Version=$VERSION"

      - name: Pack
        env:
          SOLUTION: ${{ inputs.solution }}
          VERSION: ${{ needs.validar.outputs.version }}
        run: dotnet pack "$SOLUTION" -c Release --no-build "-p:Version=$VERSION" -o ./artifacts

      - name: Upload pacotes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget
          path: artifacts/*
          retention-days: 30

  unit:
    name: Unitários
    needs: validar
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: net10.0, tfm: net10.0, coverage: true, invariant: false }
          - { name: net8.0, tfm: net8.0, coverage: false, invariant: false }
          - { name: net10.0-sem-icu, tfm: net10.0, coverage: false, invariant: true }
    uses: tudoemcodigo/tec-workflows/.github/workflows/dotnet-test.yml@v1
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      name: ${{ matrix.name }}
      tests: ${{ inputs.unit-tests }}
      tfm: ${{ matrix.tfm }}
      coverage: ${{ matrix.coverage }}
      invariant: ${{ matrix.invariant }}
      env: ${{ inputs.env }}
      private-feed: ${{ inputs.private-feed }}
      artifact: unit-${{ matrix.name }}

  report:
    name: Relatório
    needs: unit
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Relatório
        uses: tudoemcodigo/tec-workflows/actions/test-report@v1
        with:
          coverage-title: ${{ inputs.coverage-title || github.event.repository.name }}

  codeql:
    name: CodeQL
    needs: validar
    uses: tudoemcodigo/tec-workflows/.github/workflows/codeql-dotnet.yml@v1
    permissions:
      contents: read
      actions: read
      security-events: read
      packages: read
    with:
      solution: ${{ inputs.solution }}
      build-mode: ${{ inputs.codeql-build-mode }}
      queries: ${{ inputs.codeql-queries }}
      private-feed: ${{ inputs.private-feed }}

  # Portão: nada é publicado se qualquer verificação falhou ou foi cancelada (jobs pulados contam como sucesso)
  release:
    name: Criar tag e Release
    needs: [validar, conventions, pack, unit, codeql]
    if: >-
      ${{ !cancelled() && needs.pack.result == 'success' && needs.unit.result == 'success' &&
      needs.conventions.result == 'success' && needs.codeql.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download pacotes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget
          path: artifacts

      - name: Criar tag e Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validar.outputs.version }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$VERSION" == *-* ]]; then FLAGS+=(--prerelease); fi
          shopt -s nullglob
          gh release create "v$VERSION" artifacts/*.nupkg artifacts/*.snupkg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes \
            "${FLAGS[@]}"

  publicar:
    name: Publicar no GitHub Packages
    needs: [validar, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write   # push no feed NuGet do GitHub
    steps:
      - name: Download pacotes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget
          path: artifacts

      # O dotnet já instalado no runner basta para o push (sem global.json: não há checkout).
      # O GitHub Packages não aceita .snupkg; os símbolos ficam anexados ao Release.
      - name: Push no GitHub Packages
        env:
          NUGET_API_KEY: ${{ github.token }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "$NUGET_FEED"
          --api-key "$NUGET_API_KEY"
          --skip-duplicate
          --no-symbols

      - name: Resumo
        env:
          VERSION: ${{ needs.validar.outputs.version }}
        run: |
          echo "### ✅ [v$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION) publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "Feed: \`$NUGET_FEED\`" >> "$GITHUB_STEP_SUMMARY"
